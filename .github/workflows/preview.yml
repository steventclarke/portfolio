name: Deploy (preview)

on:
  push:
    branches: [preview]

permissions:
  id-token: write
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      PREVIEW_DEPLOY_ROLE_ARN: ${{ vars.PREVIEW_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run links
      - name: Mark preview build noindex
        run: node .github/scripts/add-noindex.mjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install infrastructure dependencies
        run: npm ci
        working-directory: infrastructure/cdk
      - name: Deploy infrastructure
        run: npx cdk deploy --all -c environment=preview --require-approval never --outputs-file cdk-outputs.json
        working-directory: infrastructure/cdk
      - name: Sync site to S3
        run: |
          BUCKET=$(jq -r '.["preview-PortfolioStack"].BucketName' infrastructure/cdk/cdk-outputs.json)
          aws s3 sync dist/ "s3://${BUCKET}/" --delete
      - name: Invalidate CloudFront
        run: |
          DIST=$(jq -r '.["preview-PortfolioStack"].DistributionId' infrastructure/cdk/cdk-outputs.json)
          aws cloudfront create-invalidation --distribution-id "${DIST}" --paths "/*"
