name: Preview Deploy

on:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      PREVIEW_DISTRIBUTION_ID: ${{ secrets.PREVIEW_DISTRIBUTION_ID }}
      PREVIEW_DOMAIN: preview.stevenclarke.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Add noindex
        run: echo '<meta name="robots" content="noindex,nofollow">' > /tmp/noindex.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/previews/pr-${{ github.event.number }}/ --delete
      - run: |
          if [ -n "${{ env.PREVIEW_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation --distribution-id ${{ env.PREVIEW_DISTRIBUTION_ID }} --paths "/*"
          fi
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${process.env.PREVIEW_DOMAIN}/previews/pr-${{ github.event.number }}/`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${url}`
            });
